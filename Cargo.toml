[package]
name = "brainiac"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "brainiac"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
dotenvy = "0.15"

# HTTP / SSE (LLM + TTS)
reqwest = { version = "0.12", features = ["stream", "json"] }
bytes = "1"

# Audio I/O
cpal = "0.15"
rodio = { version = "0.17", features = ["wav", "mp3"] }

# Deepgram STT WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# TUI
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
